name: Invidious Invisible Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [quick_start]

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ⚡️念のためタイムアウトを設定
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: invidious
          POSTGRES_USER: kemal
          POSTGRES_PASSWORD: kemal # 💎カカオマメ隊員の設定に合わせたぞ！
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📦 コードを抽出
        uses: actions/checkout@v4

      - name: 💎 Crystal環境のセットアップ
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: 🛠 依存関係のインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxml2-dev libyaml-dev libpcre3-dev libevent-dev
          shards install
          
          # 型エラーの自動修正パッチ（まだ直してなければこれが必要だ！）
          sed -i 's/directory_listing(context.response, request_path, file_path)/directory_listing(context.response, Path.new(request_path), Path.new(file_path))/' src/ext/kemal_static_file_handler.cr
          
      - name: 🚀 ビルド＆インビジブル起動！
        run: |
          crystal build src/invidious.cr --release
          
          # 起動確認だ！
          ./invidious --version
