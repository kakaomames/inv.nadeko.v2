name: Invidious Final Strike

on:
  workflow_dispatch:
  repository_dispatch:
    types: [quick_start]

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    # 💥 ここでRedisとPostgresを確実に召喚する！
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: invidious
          POSTGRES_USER: kemal
          POSTGRES_PASSWORD: kemal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📦 コードを抽出
        uses: actions/checkout@v4

      - name: 💎 Crystal環境のセットアップ
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: 🛠 依存関係のインストール & ソース修正
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxml2-dev libyaml-dev libpcre3-dev libevent-dev
          shards install
          # 以前の型エラー修正（念のため）
          sed -i 's/directory_listing(context.response, request_path, file_path)/directory_listing(context.response, Path.new(request_path), Path.new(file_path))/' src/ext/kemal_static_file_handler.cr

      - name: 🚀 ビルド & 起動（正面突破！）
        run: |
          crystal build src/invidious.cr --release
          
          # RedisとDBに確実に繋がるはずだ！
          ./invidious --version
